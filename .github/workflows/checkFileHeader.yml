name: Check Header for Added and Modified Files

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check_added_files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check headers on tracked C/H files
        shell: bash
        run: |
          set -euo pipefail

          script=./applications/scripts/cardiacFoamChangeCopyright.sh
          chmod +x "$script"

          # Paths excluded below are imported third-party code whose upstream
          # headers must stay intact. Only add to this list for third-party
          # code, never to make the check pass on cardiacFoam's own sources.
          #
          #   src/HFDIBDEM/
          #     openHFDIB-DEM, imported for the immersed-boundary solver. It is
          #     licensed under the LGPL and credited to Federico Municchi (2016),
          #     Martin Isoz and Martin Kotouc Sourek (2019-). Rewriting these
          #     headers to cardiacFoam's GPL block would delete that licence
          #     notice, so they are left byte-intact.
          #
          #   applications/solvers/pimpleHFDIBFoam/*.H
          #     OpenFOAM pimpleFoam include fragments. Upstream ships these .H
          #     files with no licence header at all, and correctPhi.solver.H and
          #     setRDeltaT.H are still byte-identical to OpenFOAM's, so a
          #     cardiacFoam header would misattribute them. pimpleHFDIBFoam.C
          #     itself is checked as normal.
          mapfile -t files_to_check < <(
            git ls-files '*.C' '*.H' \
              ':(exclude)src/HFDIBDEM/*' \
              ':(exclude)applications/solvers/pimpleHFDIBFoam/*.H'
          )

          if [ "${#files_to_check[@]}" -eq 0 ]; then
            echo "No tracked C/H files to check."
            exit 0
          fi

          missing_header=0

          for file in "${files_to_check[@]}"; do
            echo "Checking: $file"

            if ! grep -qE 'This file is part of (cardiacFoam|solids4foam)\.' "$file"; then
              echo "❌ Missing recognized project header: $file"
              missing_header=1
              continue
            fi

            # Run the normalizer script as a consistency check. It exits 1 when
            # it would rewrite the file, so do not fail immediately here.
            "$script" "$file" || true
          done

          if [ "$missing_header" -ne 0 ]; then
            echo "One or more tracked files are missing the required project header."
            exit 1
          fi

          if ! git diff --exit-code -- "${files_to_check[@]}"; then
            echo "❌ Header formatting drift detected."
            echo "Run the fixer locally:"
            echo "  ./applications/scripts/cardiacFoamChangeCopyright.sh <file>"
            exit 1
          fi

          echo "✅ Headers look correct."
