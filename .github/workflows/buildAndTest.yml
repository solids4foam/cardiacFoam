# Build cardiacFoam against solids4foam and run the tutorial regressions.
#
# Three kinds of leg:
#   lightweight            electrophysiology-only build, every OpenFOAM image;
#                          the three electromechanics regressions skip (77).
#   with-solids4foam/image full build against the solids4foam shipped in the
#                          Docker image, i.e. the released solids4foam line.
#                          That line lacks the fvOptions body force and the
#                          optional activeTension that the electromechanics
#                          cases need, so the regressions run in lightweight
#                          mode there: the build is checked, the
#                          electromechanics cases are skipped.
#   with-solids4foam/submodule
#                          full build against modules/solids4foam, the pinned
#                          solids4foam cardiacFoam targets, built in the job.
#                          Every regression runs, electromechanics included.

name: Build and test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    name: Build on ${{ matrix.container-image.name }} (${{ matrix.mode }}, solids4foam from ${{ matrix.solids4foam_source }})
    runs-on: ubuntu-22.04
    env:
      HOME: /root
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"

    strategy:
      fail-fast: false
      matrix:
        container-image:
          # --------------------------------------------------
          # solids4foam v2.3 images (OpenFOAM.com)
          # --------------------------------------------------
          - name: "solids4foam-v2.3-OpenFOAM-v2312"
            image: "solids4foam/solids4foam:v2.3-openfoam-v2312-latest"
            source: "/lib/openfoam/openfoam2312/etc/bashrc"
            solids4foam_dir: "/lib/solids4foam"
            buildflags: "-j"

          - name: "solids4foam-v2.3-OpenFOAM-v2412"
            image: "solids4foam/solids4foam:v2.3-openfoam-v2412-latest"
            source: "/lib/openfoam/openfoam2412/etc/bashrc"
            solids4foam_dir: "/lib/solids4foam"
            buildflags: "-j"

          - name: "solids4foam-v2.3-OpenFOAM-v2512"
            image: "solids4foam/solids4foam:v2.3-openfoam-v2512-latest"
            source: "/lib/openfoam/openfoam2512/etc/bashrc"
            solids4foam_dir: "/lib/solids4foam"
            buildflags: "-j"

        mode: [lightweight]
        solids4foam_source: [image]
        regression_mode: [lightweight]

        include:
          - container-image:
              name: "solids4foam-v2.4-OpenFOAM-v2412"
              image: "solids4foam/solids4foam:v2.4-openfoam-v2412-latest"
              source: "/lib/openfoam/openfoam2412/etc/bashrc"
              solids4foam_dir: "/lib/solids4foam"
              buildflags: "-j"
            mode: with-solids4foam
            solids4foam_source: image
            regression_mode: lightweight

          - container-image:
              name: "solids4foam-v2.4-OpenFOAM-v2412"
              image: "solids4foam/solids4foam:v2.4-openfoam-v2412-latest"
              source: "/lib/openfoam/openfoam2412/etc/bashrc"
              solids4foam_dir: "/lib/solids4foam"
              buildflags: "-j"
            mode: with-solids4foam
            solids4foam_source: submodule
            regression_mode: with-solids4foam

    container:
      image: ${{ matrix.container-image.image }}
      options: --user 0

    steps:
      # actions/checkout's `lfs: true` shells out to the git-lfs binary, and
      # the solids4foam images do not ship it - without this the checkout
      # fails with "Unable to locate executable file: git-lfs". Must run
      # before the checkout that needs it.
      - name: Install Git LFS
        run: |
          apt-get update -qq
          apt-get install -y -qq git-lfs
          git lfs install
          git lfs version

      - name: Checkout cardiacFoam
        uses: actions/checkout@v4
        with:
          # The submodule leg needs modules/solids4foam; .gitmodules points at
          # the fork that carries the pinned commit.
          submodules: ${{ matrix.solids4foam_source == 'submodule' }}
          # The idealizedHeart tutorials share one Git-LFS-tracked mesh
          # (tutorials/idealizedHeart/mesh/{0,constant/polyMesh}). Without
          # this, those paths check out as ~130-byte LFS pointer files,
          # cardiacFoam cannot read the mesh, and every regression that
          # consumes it fails as "missing output file".
          lfs: true

      - name: Mark workspace as a safe directory for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Fail fast and unambiguously if the mesh did not actually materialise.
      # Without this the first symptom is a regression reporting "missing
      # output file" twenty minutes into the run, which points at the solver
      # rather than at the checkout.
      - name: Verify Git LFS assets resolved
        shell: bash
        run: |
          set -euo pipefail

          echo "Workspace: $PWD"
          git lfs ls-files -n > /tmp/lfs-files.txt
          total=$(wc -l < /tmp/lfs-files.txt | tr -d ' ')
          echo "$total file(s) tracked by Git LFS"

          bad=0
          while IFS= read -r f; do
              if [ ! -f "$f" ]; then
                  echo "  MISSING  $f"
                  bad=$((bad + 1))
              elif head -c 40 "$f" | grep -q "git-lfs.github.com"; then
                  echo "  POINTER  $f"
                  bad=$((bad + 1))
              fi
          done < /tmp/lfs-files.txt

          if [ "$bad" -ne 0 ]; then
              echo
              echo "$bad LFS file(s) did not resolve to real content."
              echo "The idealizedHeart regressions would fail as 'missing output file'."
              exit 1
          fi
          echo "All $total resolved to real content."

          # The tutorials reach the shared mesh by relative path from their own
          # case directory (electroHeart uses ../mesh, pathos/* use ../../mesh),
          # so assert it is present where those paths land, not merely somewhere.
          echo
          for f in \
              tutorials/idealizedHeart/mesh/constant/polyMesh/points \
              tutorials/idealizedHeart/mesh/constant/polyMesh/faces \
              tutorials/idealizedHeart/mesh/constant/purkinjeGraph \
              tutorials/idealizedHeart/mesh/0/Conductivity \
              tutorials/idealizedHeart/mesh/0/fiber
          do
              printf '  %10s bytes  %s\n' "$(wc -c < "$f" | tr -d ' ')" "$f"
          done

          test -f tutorials/idealizedHeart/electroHeart/../mesh/constant/polyMesh/points
          test -f tutorials/idealizedHeart/pathos/conductionBlock/../../mesh/constant/polyMesh/points
          echo
          echo "Shared mesh resolves correctly from both case directories."

      # One environment file per leg, sourced after the OpenFOAM bashrc in
      # every later step (the bashrc resets FOAM_USER_* each time it is
      # sourced). The submodule leg installs solids4foam and cardiacFoam into
      # a user directory of its own, in front of the library path, so the
      # image's prebuilt solids4foam can never be picked up by mistake: two
      # solids4foam trees in one process link cleanly and crash at run time.
      - name: Write the leg environment
        shell: bash
        run: |
          {
            case "${{ matrix.mode }}/${{ matrix.solids4foam_source }}" in
              with-solids4foam/image)
                echo 'export SOLIDS4FOAM_INST_DIR=${{ matrix.container-image.solids4foam_dir }}'
                echo 'unset FORCE_LIGHTWEIGHT_PHYSICSMODEL'
                ;;
              with-solids4foam/submodule)
                echo 'export WM_PROJECT_USER_DIR="$GITHUB_WORKSPACE/.ci-foam-user"'
                echo 'export FOAM_USER_LIBBIN="$WM_PROJECT_USER_DIR/platforms/$WM_OPTIONS/lib"'
                echo 'export FOAM_USER_APPBIN="$WM_PROJECT_USER_DIR/platforms/$WM_OPTIONS/bin"'
                echo 'mkdir -p "$FOAM_USER_LIBBIN" "$FOAM_USER_APPBIN"'
                echo 'export LD_LIBRARY_PATH="$FOAM_USER_LIBBIN:$LD_LIBRARY_PATH"'
                echo 'export PATH="$FOAM_USER_APPBIN:$PATH"'
                echo 'export SOLIDS4FOAM_INST_DIR="$GITHUB_WORKSPACE/modules/solids4foam"'
                echo 'unset FORCE_LIGHTWEIGHT_PHYSICSMODEL'
                ;;
              *)
                echo 'unset SOLIDS4FOAM_INST_DIR'
                echo 'export FORCE_LIGHTWEIGHT_PHYSICSMODEL=1'
                ;;
            esac
          } > "$GITHUB_WORKSPACE/.ci-leg-env.sh"
          cat "$GITHUB_WORKSPACE/.ci-leg-env.sh"

      - name: Build solids4foam from the submodule
        if: matrix.solids4foam_source == 'submodule'
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          source "$GITHUB_WORKSPACE/.ci-leg-env.sh"
          git -C modules/solids4foam log -1 --format='solids4foam %h %ad %s' --date=short
          (cd modules/solids4foam && ./Allwmake ${{ matrix.container-image.buildflags }})
          test -f modules/solids4foam/src/solids4FoamModels/lnInclude/solidModel.H
          ls "$FOAM_USER_LIBBIN"/libsolids4FoamModels.*

      - name: Regression index check
        shell: bash
        run: ./tutorials/regression/checkIndex.sh

      - name: Build cardiacFoam
        shell: bash -l {0}
        run: |
          echo "Sourcing OpenFOAM environment"
          source ${{ matrix.container-image.source }}
          source "$GITHUB_WORKSPACE/.ci-leg-env.sh"

          ./Allwmake ${{ matrix.container-image.buildflags }}

      - name: Tutorial regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          source "$GITHUB_WORKSPACE/.ci-leg-env.sh"

          CARDIAC_REGRESSION_BUILD_MODE="${{ matrix.regression_mode }}" ./tutorials/Alltest-regression

      - name: PETSc sanity check
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          echo "PETSC_DIR = $PETSC_DIR"
          test -d "$PETSC_DIR/include"

      - name: Debug resolution
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          source "$GITHUB_WORKSPACE/.ci-leg-env.sh"

          source etc/resolveSolids4Foam.sh

          echo "Resolved SOLIDS4FOAM_INST_DIR=$SOLIDS4FOAM_INST_DIR"
          echo "USE_LIGHTWEIGHT_PHYSICSMODEL=$USE_LIGHTWEIGHT_PHYSICSMODEL"
