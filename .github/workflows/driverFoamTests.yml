# driverFOAM Python contract tests
#
# Gates the driverFoam orchestration layer and, crucially, the catalogue
# contract tests that compare dict_entries.py / the RTST + tutorial catalogues
# against the C++ source tree under src/. These tests need only Python and the
# checked-out source (the one binary-dependent integration test self-skips when
# `cardiacFoam` is absent), so they run in a lightweight job independent of the
# heavyweight OpenFOAM build matrix in buildAndTest.yml.
#
# Why this exists: catalogue drift (a renamed C++ dict key, a new
# runtime-selection table, a tutorial added to the registry without a display
# row) repeatedly landed on the default branch because nothing ran this suite
# on every PR. This workflow is that gate.

name: driverFOAM tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "applications/scripts/driverFoam/**"
      - ".github/workflows/driverFoamTests.yml"

jobs:
  driverfoam-tests:
    name: driverFOAM contract + unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout cardiacFoam
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install driverFoam (editable, with post extras) and pytest
        # The [post] extra pulls pandas/numpy/matplotlib, required by the
        # postprocessing-driver tests. Without it those tests error on import.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "applications/scripts/driverFoam[post]"
          python -m pip install pytest

      - name: Run driverFoam test suite
        # SKIP_ENV_DIAGNOSTICS=1: no OpenFOAM environment is sourced in this
        # job, so the strict-planning environment preflight is bypassed. The
        # catalogue contract tests do not need a built solver — only src/.
        env:
          SKIP_ENV_DIAGNOSTICS: "1"
        run: |
          cd applications/scripts/driverFoam
          python -m pytest openfoam_driver/tests/ -q
