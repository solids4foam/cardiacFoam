# applications/utilities/sweepCurrents/utility.manifest.toml

name = "sweepCurrents"
description = "Sweep ionic currents and gating variables against membrane voltage for a configured ionic model."

purpose = """
Reads constant/sweepCurrents (which specifies the ionicModel, tissue type,
voltage range, and the list of currents to sweep) and for each requested current
evaluates the current and its gating/dependency variables across a uniform Vm
grid from Vmin to Vmax. Each current's sweep is written as a CSV file to
postProcessing/<model>_<tissue>_<current>_sweep.txt. Set listCurrentsOnly true
to print available current names without running any sweep, which is useful for
exploring a new ionic model.
"""

inputs = [
  "constant/sweepCurrents",
]

outputs = [
  "postProcessing/<model>_<tissue>_<current>_sweep.txt",
]

requires_mesh = false

example = "sweepCurrents -case ./singleCell_run"

category = "post-processing"
