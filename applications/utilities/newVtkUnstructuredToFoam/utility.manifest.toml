# applications/utilities/newVtkUnstructuredToFoam/utility.manifest.toml

name = "newVtkUnstructuredToFoam"
description = "Convert a legacy ASCII VTK unstructured grid to an OpenFOAM mesh, including tensor fields."

purpose = """
Extended version of the standard vtkUnstructuredToFoam that additionally
reads scalar, vector, and tensor CELL_DATA fields from the VTK file and
reconstructs them as volFields on the imported fvMesh. The resulting mesh is
written to constant/polyMesh with no boundary-patch information (all faces are
assigned to a single default patch). Pass -no-fields to import only the mesh
topology without attempting to reconstruct fields.

IMPORTANT — two post-import steps are always required:

1. Scale mesh to SI metres (VTK files are typically in mm):
       transformPoints -scale '(0.001 0.001 0.001)' -case ./myCase

2. Fix conductivity dimensions — all CELL_DATA fields are written as dimless
   [0 0 0 0 0 0 0]. Only conductivity (conductivity tensor) needs fixing:
       sed -i.bak 's/dimensions.*\\[0 0 0 0 0 0 0\\]/dimensions      [-1 -3 3 0 0 2 0]/' 0/conductivity
   Other fields (fiber, sheet, uvc_transmural, tags) are genuinely dimensionless.

Then run: checkMeshGeometry && checkMesh to validate.
"""

inputs = [
  "<vtk-file>",
]

outputs = [
  "constant/polyMesh",
]

requires_mesh = false

positional_args = [
  {name = "vtk_file", argument_kind = "path", description = "Input legacy ASCII VTK file (UNSTRUCTURED_GRID) to import."},
]

example = "newVtkUnstructuredToFoam myMesh.vtk -case ./myCase"

category = "io-conversion"

[[flags]]
name = "-no-fields"
description = "Skip reconstruction of volFields from VTK CELL_DATA."
takes_value = false
argument_kind = "switch"

[[produces]]
artifact_id = "vtk_imported_polymesh"
path_pattern = "constant/polyMesh"
format = "openfoam_log"
description = "Imported OpenFOAM polyMesh directory from the input VTK file, including any reconstructed volFields."
produced_by = "newVtkUnstructuredToFoam"
