# applications/utilities/setFibreField/utility.manifest.toml

name = "setFibreField"
description = "Compute and write fibre orientation fields for cardiac simulations from a transmural distance field."

purpose = """
Solves a Laplace equation on the mesh to produce a transmural-distance scalar
field t (with endocardium = 0, epicardium = 1), then computes orthonormal
transmural (et), normal (en), and longitudinal (el) directions using the
Rossi-Lassila approach. The fibre direction f0 is obtained by rotating el about
et by an angle that varies linearly from alphaEndo (60°) to alphaEpi (-60°). All
six volumetric and surface fields are written to the current time directory.
Currently hard-coded for the Land et al. (2015) ellipsoidal ventricle benchmark
geometry — alphaEndo/alphaEpi are compile-time constants.
"""

inputs = [
  "0/t",
]

outputs = [
  "0/t",
  "0/et",
  "0/en",
  "0/el",
  "0/alphaRadians",
  "0/f0",
  "0/etf",
  "0/enf",
  "0/elf",
  "0/alphaRadiansf",
  "0/f0f",
]

requires_mesh = true

example = "setFibreField -case ./ellipsoid_run"

category = "field-setup"

[[produces]]
artifact_id = "fibre_field_t"
path_pattern = "0/t"
format = "openfoam_log"
description = "Transmural distance scalar field (0 = endocardium, 1 = epicardium)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_et"
path_pattern = "0/et"
format = "openfoam_log"
description = "Transmural direction unit vector field (volumetric)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_en"
path_pattern = "0/en"
format = "openfoam_log"
description = "Normal direction unit vector field (volumetric)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_el"
path_pattern = "0/el"
format = "openfoam_log"
description = "Longitudinal direction unit vector field (volumetric)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_alpha_radians"
path_pattern = "0/alphaRadians"
format = "openfoam_log"
description = "Fibre rotation angle (radians) per cell, varying linearly from alphaEndo to alphaEpi."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_f0"
path_pattern = "0/f0"
format = "openfoam_log"
description = "Fibre orientation unit vector field (volumetric), used as the primary fibre direction."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_etf"
path_pattern = "0/etf"
format = "openfoam_log"
description = "Transmural direction unit vector field (surface/face-centred)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_enf"
path_pattern = "0/enf"
format = "openfoam_log"
description = "Normal direction unit vector field (surface/face-centred)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_elf"
path_pattern = "0/elf"
format = "openfoam_log"
description = "Longitudinal direction unit vector field (surface/face-centred)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_alpha_radians_f"
path_pattern = "0/alphaRadiansf"
format = "openfoam_log"
description = "Fibre rotation angle (radians) per face (surface-centred)."
produced_by = "setFibreField"

[[produces]]
artifact_id = "fibre_field_f0f"
path_pattern = "0/f0f"
format = "openfoam_log"
description = "Fibre orientation unit vector field (surface/face-centred)."
produced_by = "setFibreField"
