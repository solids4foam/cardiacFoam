name = "setManufacturedLeadFields"
description = "Generate synthetic lead-field projection fixtures for FDA voltage and eikonal template cases."
category = "verification"
purpose = "Generate synthetic lead-field projection fixtures for FDA voltage and eikonal template cases."
inputs = ["constant/leadFieldProperties", "constant/polyMesh"]
outputs = ["0/leadField_*", "0/leadFieldGi", "0/leadFieldGe", "0/leadFieldMeshSignature", "constant/leadFieldMetadata"]
requires_mesh = true
example = "setManufacturedLeadFields -case ./case"

[[flags]]
name = "-checkSealedWall"
description = "Verify private sealed-wall affine gradients and unchanged Vm/phiE source snapshots."
takes_value = false

[[flags]]
name = "-eikonal"
description = "Write constant sensitivities and check four uniform template observers with affine activation, a stale cache and no Vm provider."
takes_value = false

[[flags]]
name = "-eikonalGuard"
description = "Exercise a template or sampling rejection; expected failure, without changing case inputs."
takes_value = true
