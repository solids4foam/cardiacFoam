schema_version: 1
plugin:
  id: org.driverfoam.generic-openfoam  # Reverse-DNS id; must match plugin_id property
  api_version: "2"                      # "1" or "2"; "2" is required for sweep support

# case_profile.dictionaries lists the files driverFOAM will track for this plugin.
# Each entry describes one file relative to the case root.
#
# Field reference:
#   path      (required) - path relative to the case root.
#   kind      (required) - one of:
#               openfoam_dictionary  : standard OpenFOAM keyword-value file
#               case_script          : shell script (Allrun, Allclean, ...)
#               documentation        : human-readable file (README.md, ...)
#   role      (required) - semantic role tag; common values:
#               openfoam.control_dict       : system/controlDict
#               openfoam.discretisation     : system/fvSchemes
#               openfoam.solver_settings    : system/fvSolution
#               openfoam.decomposition      : system/decomposeParDict
#               openfoam.mesh_generation    : system/blockMeshDict
#               openfoam.entrypoint         : Allrun
#               openfoam.cleanup            : Allclean
#               plugin.configuration        : solver-specific constant/* file
#               case.documentation          : README.md
#               case.regression_test        : runRegressionTest.sh
#   required  (required) - one of:
#               always       : the driver expects this file at plan time
#               conditional  : optional; driver skips checks if file is absent
case_profile:
  dictionaries: []   # No plugin-owned dictionaries for the generic stub.
                     # A real plugin lists its constant/* files here; see
                     # plugins/cardiacfoam/plugin.yaml for a full example.

# cxx_mapping is OPTIONAL.
# Include it only if your plugin has C++ source files whose dict keys should
# be audited against a reviewed allowlist (dict_key_allowlist.json).
#
# cxx_mapping:
#   source_roots:
#     - path/to/your/src          # relative to this yaml file's directory
#   reviewed_allowlist: dict_key_allowlist.json  # auto-generated; commit & keep CI green
