[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiacfoam-tutorials-driver"
version = "0.1.0"
description = "Reusable Python-spec driver for OpenFOAM tutorial automation."
readme = "openfoam_driver/README.md"
requires-python = ">=3.10"
authors = [
  { name = "cardiacFoam contributors" }
]
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
post = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.0",
  "prompt-toolkit>=3.0",
  "openpyxl>=3.1",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pyvista>=0.44",
    "trimesh>=4.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
foamctl = "openfoam_driver.cli:main"
driverFoam = "openfoam_driver.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a real cardiacFoam binary (skipped by default in CI)",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"openfoam_driver.scripts" = ["dict_key_allowlist.json"]
"openfoam_driver.schemas" = ["run-document.json"]
"openfoam_driver.specs" = ["fixtures/single_cell_polymesh/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["openfoam_driver*"]
